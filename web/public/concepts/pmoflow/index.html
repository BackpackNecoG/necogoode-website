<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>PMOFlow — concept</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/concepts/pmoflow/app/styles.css" />
<link rel="stylesheet" href="/concepts/pmoflow/app/css/design.css" />
<link rel="stylesheet" href="/concepts/pmoflow/app/css/pmo.css" />
<link rel="stylesheet" href="/concepts/pmoflow/app/css/release.css" />
</head>
<body>
<header class="top">
  <a class="brand" id="brand" href="/concepts/pmoflow/" data-link><span class="mark">▾</span>PMOFlow</a>
  <button class="menubtn" id="menuBtn" aria-expanded="false" aria-controls="topmenu"><span aria-hidden="true">☰</span> Menu</button>
  <div class="topmenu" id="topmenu">
    <nav id="nav" aria-label="Main"></nav>
    <div class="who"><span>Viewing as</span><select id="persona" aria-label="Viewing as"></select>
      <details class="viewmenu" id="viewmenu"><summary title="View options">⚙ View</summary>
        <div class="vm-pop"><label class="advtog"><input type="checkbox" id="adv" /> <span>Advanced tools</span></label>
        <div class="hint">Adds earned value, sprints, BPMN and version compare. Everything else stays the same.</div></div></details>
    </div>
  </div>
  <button class="bell" id="bell" aria-label="Notifications">🔔<span class="n" id="bellN" hidden></span></button>
</header>
<main id="app"><div class="empty">Loading workspace…</div></main>
<!-- engine: classic UMD script shared byte-for-byte with the API -->
<script src="/concepts/pmoflow/app/engine.js"></script>
<script type="module" src="/concepts/pmoflow/app/main.js"></script>
</body>
</html>
