<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>PMOFlow — concept</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff; --ink:#111827; --ink2:#4b5563; --ink3:#9ca3af; --line:#e5e7eb;
    --accent:#4f46e5; --accent-soft:#eef2ff;
    --done:#16a34a; --done-fill:#ecfdf3; --prog:#2563eb; --prog-fill:#eff6ff; --idle-fill:#f9fafb;
    --soon:#f59e0b; --late:#dc2626; --late-soft:#fef2f2; --soon-soft:#fffbeb;
    --live:#16a34a; --example:#d97706; --missing:#dc2626;
    --r:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer}
  /* top bar */
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;background:#0f1020;color:#fff}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2px}
  .brand .mark{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#818cf8,#4f46e5);display:grid;place-items:center;font-size:12px}
  .top nav{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap}
  .top nav a{padding:6px 10px;border-radius:8px;color:#c7c9e0;font-size:13px}
  .top nav a.on,.top nav a:hover{background:#25264a;color:#fff}
  .top .tag{margin-left:auto;font-size:11px;color:#a5a8d6;border:1px solid #33355e;padding:3px 8px;border-radius:999px;white-space:nowrap}
  main{max-width:1440px;margin:0 auto;padding:18px}
  /* header block */
  .hdr{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:12px}
  .crumbs{font-size:12px;color:var(--ink3);margin-bottom:4px}
  .crumbs a{color:var(--accent)}
  .hdr h1{margin:0;font-size:20px}
  .hdr p{margin:4px 0 0;color:var(--ink2);max-width:820px}
  .hdr input.title{font-size:20px;font-weight:700;border:1px dashed var(--line);border-radius:8px;padding:4px 8px;width:100%;max-width:560px}
  .hdr textarea{width:100%;max-width:820px;border:1px dashed var(--line);border-radius:8px;padding:6px 8px;font:inherit;color:var(--ink2);margin-top:6px;resize:vertical}
  .res{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
  .res .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);margin-right:2px}
  .person{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 3px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px}
  .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;flex:none}
  .person small{color:var(--ink3)}
  .hdr-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
  .seg button{border:0;background:#fff;padding:6px 12px;font-size:12px;color:var(--ink2)}
  .seg button.on{background:var(--accent);color:#fff}
  .btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:13px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .kpis{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .kpi{border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:92px;background:#fff}
  .kpi b{display:block;font-size:18px}
  .kpi span{font-size:11px;color:var(--ink3)}
  .bar{height:6px;border-radius:99px;background:#eef0f4;overflow:hidden;width:220px}
  .bar i{display:block;height:100%;background:var(--done)}
  /* layout */
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;margin-top:16px}
  .canvas{background:var(--panel) radial-gradient(#e7e9f2 1px,transparent 1px) 0 0/18px 18px;border:1px solid var(--line);border-radius:var(--r);padding:22px 12px 40px;min-height:600px;overflow-x:auto}
  .side{display:flex;flex-direction:column;gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
  .card h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink2);display:flex;align-items:center;gap:6px}
  .card h3 .n{margin-left:auto;background:#f3f4f6;color:var(--ink2);border-radius:99px;padding:1px 8px;font-size:11px}
  .row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid #f1f2f5}
  .row:first-of-type{border-top:0;padding-top:0}
  .row .t{font-weight:600;font-size:13px}
  .row .s{font-size:12px;color:var(--ink2)}
  .row .r{margin-left:auto;text-align:right;font-size:12px;white-space:nowrap}
  .row.click{cursor:pointer}
  .row.click:hover .t{color:var(--accent)}
  /* flow */
  .flow{display:flex;flex-direction:column;align-items:center;min-width:max-content;margin:0 auto}
  .conn{width:2px;height:26px;background:#c7cbd6;position:relative}
  .conn.add{height:34px}
  .conn .plus{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;border:1px solid #c7cbd6;background:#fff;color:var(--ink3);font-size:14px;line-height:17px;text-align:center;opacity:0;transition:.15s}
  .flow:hover .conn .plus{opacity:1}
  .node{width:380px;max-width:calc(100vw - 70px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);cursor:pointer;position:relative;transition:transform .12s, box-shadow .12s}
  .node:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(16,24,40,.10)}
  .node .nh{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #f1f2f5}
  .node .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:13px;flex:none}
  .node .ttl{font-weight:650;font-size:14px}
  .node .num{font-size:11px;color:var(--ink3)}
  .node .nb{padding:8px 12px 10px;display:flex;flex-direction:column;gap:7px}
  .node .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink2)}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink2);white-space:nowrap}
  .chip .dot{width:7px;height:7px;border-radius:50%}
  .chip.touch{background:#f5f3ff;border-color:#e4defc;color:#5b21b6}
  .chip.data{cursor:pointer}
  .chip.data:hover{border-color:var(--accent)}
  .chip.block{background:var(--late-soft);border-color:#fecaca;color:var(--late);font-weight:600}
  .chip.diff-new{background:#ecfeff;border-color:#a5f3fc;color:#0e7490;font-weight:700;font-size:10px;letter-spacing:.5px}
  .chip.diff-changed{background:#fdf4ff;border-color:#f5d0fe;color:#a21caf;font-weight:700;font-size:10px;letter-spacing:.5px}
  .node.trigger .ic{background:#fff7ed;color:#c2410c}
  .node.end{width:auto;padding:7px 16px;border-radius:999px;font-size:12px;color:var(--ink2);cursor:default}
  /* project state encoding: fill = status, border = schedule */
  .pm .node.s-done{background:var(--done-fill);border-color:#bbf7d0}
  .pm .node.s-done .ic{background:#dcfce7;color:var(--done)}
  .pm .node.s-prog{background:var(--prog-fill)}
  .pm .node.s-prog .ic{background:#dbeafe;color:var(--prog)}
  .pm .node.s-idle{background:var(--idle-fill)}
  .pm .node.sch-soon{border:2px solid var(--soon)}
  .pm .node.sch-late{border:2px solid var(--late)}
  .pm .node.s-prog::before{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--prog)}
  .node.dim{opacity:.28}
  .node.hl{outline:3px solid var(--accent);outline-offset:2px}
  .badge{font-size:11px;padding:1px 7px;border-radius:99px;font-weight:600}
  .b-done{background:#dcfce7;color:#15803d}.b-prog{background:#dbeafe;color:#1d4ed8}.b-idle{background:#f3f4f6;color:#4b5563}
  .b-late{background:var(--late-soft);color:var(--late)}.b-soon{background:var(--soon-soft);color:#b45309}.b-ok{background:#f3f4f6;color:#4b5563}
  /* decision */
  .decision{display:flex;flex-direction:column;align-items:center}
  .diamond{background:#fff;border:1px solid #fcd34d;color:#92400e;font-weight:650;font-size:13px;padding:8px 16px;border-radius:10px;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
  .branches{display:flex;gap:28px;position:relative;padding-top:26px;margin-top:0}
  .branches::before{content:"";position:absolute;top:0;left:var(--bl,25%);right:var(--br,25%);height:2px;background:#c7cbd6}
  .branch{display:flex;flex-direction:column;align-items:center;position:relative}
  .branch::before{content:"";position:absolute;top:-26px;left:50%;width:2px;height:26px;background:#c7cbd6}
  .blabel{font-size:11px;font-weight:700;color:#92400e;background:#fffbeb;border:1px solid #fde68a;padding:1px 8px;border-radius:99px;margin-bottom:8px;position:relative;z-index:1}
  .passthru{font-size:12px;color:var(--ink3);border:1px dashed #d1d5db;border-radius:10px;padding:10px 16px;background:#fff;width:200px;text-align:center}
  .merge{width:60%;height:2px;background:#c7cbd6;margin-top:0}
  /* lanes */
  .lanes{display:grid;gap:0;min-width:max-content}
  .lane-h{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:8px 10px;font-size:12px;font-weight:650;display:flex;gap:6px;align-items:center}
  .lane-c{padding:8px 10px;border-right:1px dashed #e5e7eb;min-height:74px;display:flex;align-items:center;justify-content:center}
  .lanes .node{width:230px}
  .lanes .node .nb .chips{display:none}
  /* legend */
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:12px;color:var(--ink2)}
  .sw{display:inline-block;width:26px;height:16px;border-radius:5px;vertical-align:-3px;margin-right:6px;border:1px solid var(--line)}
  /* drill */
  .kgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:16px}
  .kc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
  .kc span{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px}
  .kc b{display:block;font-size:20px;margin-top:2px}
  .kc small{color:var(--ink2)}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:8px;border-bottom:1px solid #f1f2f5;vertical-align:top}
  tr.click{cursor:pointer} tr.click:hover td{background:#fafaff}
  .sub{display:flex;gap:10px;align-items:flex-start;padding:10px 0;position:relative}
  .sub .dotc{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;border:2px solid #d1d5db;background:#fff;color:var(--ink3);z-index:1}
  .sub.done .dotc{background:var(--done);border-color:var(--done);color:#fff}
  .sub.prog .dotc{border-color:var(--prog);color:var(--prog)}
  .sub.blocked .dotc{border-color:var(--late);color:var(--late)}
  .subs{position:relative}
  .subs::before{content:"";position:absolute;left:10px;top:18px;bottom:18px;width:2px;background:#e5e7eb}
  .home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:12px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;transition:.12s}
  .tile:hover{border-color:#c7d2fe;transform:translateY(-1px)}
  .tile h4{margin:0;font-size:15px}
  .tile p{margin:0;color:var(--ink2);font-size:13px}
  .sect{display:flex;align-items:center;gap:10px;margin-top:22px}
  .sect h2{margin:0;font-size:15px}
  .hint{font-size:12px;color:var(--ink3)}
  .form{border:1px dashed #c7d2fe;background:#fafaff;border-radius:12px;padding:12px;width:380px;max-width:calc(100vw - 70px);display:flex;flex-direction:column;gap:8px}
  .form input,.form select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
  .form label{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px}
  .pgroup{margin-bottom:8px}
  .pgroup-h{display:flex;align-items:center;gap:8px;margin:6px auto 14px;width:max-content;max-width:100%;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:650;box-shadow:var(--shadow)}
  .pgroup + .pgroup{margin-top:34px;padding-top:24px;border-top:2px dashed #dfe2ea}
  .note{font-size:12px;color:var(--ink2);background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  @media (max-width:1060px){ .grid{grid-template-columns:minmax(0,1fr)} .grid > *{min-width:0} .kgrid{grid-template-columns:repeat(2,minmax(0,1fr))} .two{grid-template-columns:1fr} }
  @media (max-width:640px){ main{padding:12px} .hdr{grid-template-columns:1fr} .hdr-side{align-items:flex-start} .kpis{justify-content:flex-start} .top .tag{display:none} .canvas{padding:16px 10px 30px} .bar{width:160px}
    .canvas > .flow, .pgroup > .flow{min-width:0;width:100%} .flow .flow{width:100%} .node,.form{width:100%;max-width:none}
    .branches{flex-direction:column;gap:14px;padding-top:12px;width:100%} .branches::before,.branch::before{display:none} .branch{width:100%} .passthru{width:auto;align-self:stretch}}
  /* v2 additions */
  .node .stats{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink2);align-items:center}
  .node .stats b{color:var(--ink)}
  .was{font-size:11.5px;color:#a21caf;background:#fdf4ff;border-radius:6px;padding:3px 7px}
  .ghost{width:380px;max-width:calc(100vw - 70px);border:1px dashed #f0abfc;border-radius:12px;padding:9px 12px;background:#fff;color:#a21caf;font-size:13px;text-decoration:line-through;opacity:.8}
  .collapsed{width:380px;max-width:calc(100vw - 70px);border:1px dashed #cbd5e1;border-radius:12px;padding:9px 12px;background:#fff;color:var(--ink2);font-size:12.5px;cursor:pointer;text-align:left}
  .collapsed:hover{border-color:var(--accent);color:var(--accent)}
  .b-slip{background:var(--late-soft);color:var(--late)}
  .b-none{background:#f3f4f6;color:#6b7280}
  .pm .node.s-none{background:#fff;opacity:.75}
  .pm .node.sch-slip{border:2px solid var(--late)}
  .tl{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
  .tl table{min-width:820px;border-collapse:collapse}
  .tl td{border-bottom:1px solid #f1f2f5;padding:0;height:40px}
  .tl .lab{position:sticky;left:0;background:#fff;z-index:2;width:250px;min-width:250px;padding:6px 10px;border-right:1px solid var(--line)}
  .tl .lab .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
  .tl .lab .s{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
  .tl .lane{position:relative}
  .tl .grp td{background:#f8fafc;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2);height:28px}
  .tl .grp .lab{background:#f8fafc}
  .tbar{position:absolute;top:10px;height:20px;border-radius:6px;font-size:10.5px;color:#fff;display:flex;align-items:center;padding:0 6px;white-space:nowrap;overflow:hidden}
  .tbar.done{background:var(--done)} .tbar.prog{background:var(--prog)} .tbar.idle{background:#94a3b8}
  .tslip{position:absolute;top:10px;height:20px;border-radius:0 6px 6px 0;background:repeating-linear-gradient(45deg,#fecaca,#fecaca 4px,#fee2e2 4px,#fee2e2 8px);border:1px solid #fca5a5}
  .tday{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:1}
  .tgt{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed #16a34a;z-index:1}
  .thead td{height:30px;font-size:10.5px;color:var(--ink3)}
  .tick{position:absolute;top:8px;transform:translateX(-50%);white-space:nowrap}
  .wi{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid #f1f2f5}
  .wi:first-of-type{border-top:0}
  .dep{font-size:11.5px;color:var(--ink2)}
  @media (max-width:640px){ .ghost,.collapsed{width:100%;max-width:none} .tl .lab{width:150px;min-width:150px} .tl .lab .t,.tl .lab .s{max-width:132px} }
</style>
</head>
<body>
<header class="top">
  <a class="brand" id="brand" href="/concepts/pmoflow/" data-link><span class="mark">▾</span>PMOFlow</a>
  <nav id="nav"></nav>
  <span class="tag">Concept · demo data (Northwind)</span>
</header>
<main id="app"></main>

<script>
/* =====================================================================
   PMOFlow concept v2 — single-file SPA. All data is fictional (Northwind).
   Model:  Process (as-is + to-be steps) ── needs ──> Data elements
           Project ── Work items ── deliver ──> to-be steps
           Work items can RESOLVE a missing data element and DEPEND on others;
           forecasts ripple through dependencies.
   Routes (history API, base /concepts/pmoflow):
     /  /process/:pid  /process/:pid/step/:sid  /project/:prj  /data/:did  /new
   ===================================================================== */
const BASE = (() => { const i = location.pathname.indexOf('/concepts/pmoflow'); return i >= 0 ? location.pathname.slice(0, i) + '/concepts/pmoflow' : ''; })();
const TODAY = new Date('2026-11-04T12:00:00');

const PEOPLE = {
  mc:{name:'Maya Chen',role:'Process Owner · BA',color:'#7c3aed'},
  ta:{name:'Tom Alvarez',role:'Project Manager',color:'#0891b2'},
  ps:{name:'Priya Shah',role:'Compliance SME',color:'#db2777'},
  lp:{name:'Leo Park',role:'Treasury SME',color:'#ea580c'},
  ar:{name:'Ana Ruiz',role:'AP Lead',color:'#16a34a'},
  dk:{name:'Dev Kumar',role:'Integration Eng.',color:'#2563eb'},
};
const AVAIL = {
  live:{label:'Live integration',short:'Live',color:'var(--live)'},
  example:{label:'Examples only',short:'Examples',color:'var(--example)'},
  missing:{label:'Missing',short:'Missing',color:'var(--missing)'},
};
/* fields = what the BA actually specifies; samples = example artifacts on file */
const DATA = {
  D1:{name:'Vendor legal name & Tax ID',owner:'mc',source:'W-9 upload (vendor portal)',avail:'example',note:'12 sample W-9s collected; no parser yet.',fields:[['Legal name','text','Required'],['Tax ID (EIN)','##-#######','Required'],['Entity type','list','Required'],['Address','text','Required']],samples:['w9_acme_supply.pdf','w9_bluefin_logistics.pdf','w9_cobalt_parts.pdf']},
  D2:{name:'Bank remittance details',owner:'lp',source:'Treasury portal',avail:'missing',note:'Arrives today as emailed PDFs. No structured capture or API exists.',fields:[['Bank name','text','Required'],['Routing number','9 digits','Required'],['Account number','text, masked','Required'],['Account holder','text','Must match legal name']],samples:[]},
  D3:{name:'Certificate of insurance',owner:'ps',source:'Vendor portal upload',avail:'example',note:'Sample COIs on file; expiry dates captured manually.',fields:[['Carrier','text','Required'],['Coverage amount','currency','≥ $1M'],['Expiry date','date','Required']],samples:['coi_acme_2026.pdf','coi_bluefin_2026.pdf']},
  D4:{name:'Vendor master record',owner:'ar',source:'ERP vendor API',avail:'live',note:'Read/write API available in sandbox and production.',fields:[['Vendor ID','system','Generated'],['Payment terms','list','Required'],['Remit-to','ref → D2','Required']],samples:['erp_vendor_schema.json']},
  D5:{name:'Sanctions screening result',owner:'ps',source:'Screening service API',avail:'missing',note:'Screening vendor contract pending signature.',fields:[['Match status','clear / review / hit','Required'],['Screened at','timestamp','Required'],['Lists checked','list','Required']],samples:[]},

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const D = s => new Date(s+'T12:00:00');
const iso = d => d.toISOString().slice(0,10);
const addDays = (s,n) => { const d=D(s); d.setDate(d.getDate()+n); return iso(d); };
const fmt = s => D(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const days = s => Math.round((D(s) - TODAY)/86400000);
const maxDate = arr => arr.filter(Boolean).sort().slice(-1)[0];
function flatSteps(nodes){ const out=[]; nodes.forEach(n=>{ if(n.type==='decision') n.branches.forEach(b=>out.push(...flatSteps(b.nodes))); else if(n.type!=='end' && n.type!=='trigger') out.push(n); }); return out; }
function allSteps(){ const out=[]; for(const [pid,p] of Object.entries(PROCESSES)) flatSteps(p.nodes).forEach(s=>out.push({pid,p,s})); return out; }
function findStep(pid,sid){ return flatSteps(PROCESSES[pid].nodes).find(s=>s.id===sid); }
const W = id => WORK.find(w=>w.id===id);
const statusLbl = {done:'Done',prog:'In progress',idle:'Not started',none:'No change'};

/* Forecast: an item cannot finish before its dependencies finish + its own duration;
   an unstarted item whose start date has passed cannot finish before today + duration. */
const _fc = {};
function forecast(w){
  if(_fc[w.id]) return _fc[w.id];
  if(w.status==='done') return _fc[w.id]=w.due;
  const dur = Math.max(1, Math.round((D(w.due)-D(w.start))/86400000));
  const cands=[w.due];
  (w.deps||[]).forEach(d=>{ const dep=W(d); if(dep.status!=='done') cands.push(addDays(forecast(dep),dur)); });
  if(w.status==='idle' && days(w.start)<0) cands.push(addDays(iso(TODAY),dur));
  return _fc[w.id]=maxDate(cands);
}
function wSched(w){ if(w.status==='done') return 'ok'; const f=forecast(w); if(days(w.due)<0) return 'late'; if(f>w.due) return 'slip'; if(days(w.due)<=5) return 'soon'; return 'ok'; }
function dependents(id){ const out=new Set(); const walk=x=>WORK.filter(w=>(w.deps||[]).includes(x)).forEach(w=>{ if(!out.has(w.id)){out.add(w.id); walk(w.id);} }); walk(id); return [...out]; }
function resolverOf(d){ return WORK.find(w=>w.resolves===d); }
function dataReady(d){ const x=DATA[d]; if(x.avail!=='missing') return true; const r=resolverOf(d); return r && r.status==='done'; }
function stepWork(pid,sid){ return WORK.filter(w=>w.pid===pid && w.step===sid); }
function stepBlockers(s){ return (s.data||[]).filter(d=>!dataReady(d)); }
/* Project state of a step is DERIVED from its work items */
function stepState(pid,s){
  const items = stepWork(pid,s.id);
  if(!items.length) return {items,status:'none',sched:'ok',blockers:[]};
  const done=items.filter(w=>w.status==='done').length;
  const status = done===items.length?'done':(items.some(w=>w.status!=='idle')?'prog':'idle');
  const open=items.filter(w=>w.status!=='done');
  const due=maxDate(items.map(w=>w.due)), fc=maxDate(items.map(forecast));
  const order=['late','slip','soon','ok']; const sched = open.map(wSched).sort((a,b)=>order.indexOf(a)-order.indexOf(b))[0]||'ok';
  const next=open.map(w=>w.due).sort()[0];
  return {items,status,done,due,fc,next,sched,blockers: status==='done'?[]:stepBlockers(s)};
}
function readiness(s){ const d=s.data||[]; return {live:d.filter(x=>DATA[x].avail==='live').length,total:d.length,missing:d.filter(x=>DATA[x].avail==='missing').length}; }
function av(id){ const p=PEOPLE[id]; if(!p) return ''; const ini=p.name.split(' ').map(x=>x[0]).join(''); return `<span class="av" style="background:${p.color}" title="${esc(p.name)}">${ini}</span>`; }
function person(id){ const p=PEOPLE[id]; return `<span class="person">${av(id)}${esc(p.name)} <small>${esc(p.role)}</small></span>`; }
function dot(d){ return `<span class="dot" style="width:8px;height:8px;border-radius:50%;display:inline-block;background:${AVAIL[DATA[d].avail].color}"></span>`; }
function wBadge(w){
  if(w.status==='done') return `<span class="badge b-done">Done ${fmt(w.due)}</span>`;
  const sc=wSched(w), f=forecast(w), n=days(w.due);
  if(sc==='late') return `<span class="badge b-late">${-n}d late${f>w.due?' · now '+fmt(f):''}</span>`;
  if(sc==='slip') return `<span class="badge b-slip">Slipping → ${fmt(f)}</span>`;
  if(sc==='soon') return `<span class="badge b-soon">Due in ${n}d</span>`;
  return `<span class="badge b-ok">Due ${fmt(w.due)}</span>`;
}
function stBadge(st){
  if(st.status==='none') return `<span class="badge b-none">No change</span>`;
  if(st.status==='done') return `<span class="badge b-done">Done</span>`;
  const n=days(st.due);
  const sch = st.sched==='late'?`<span class="badge b-late">Late${st.fc>st.due?' · now '+fmt(st.fc):''}</span>`
    : st.sched==='slip'?`<span class="badge b-slip">Slipping → ${fmt(st.fc)}</span>`
    : st.sched==='soon'?`<span class="badge b-soon">Next due in ${days(st.next)}d</span>`:`<span class="badge b-ok">Due ${fmt(st.due)}</span>`;
  return `<span class="badge b-${st.status}">${statusLbl[st.status]}</span>${sch}`;
}

function nodeHTML(n,pid,idx,mode){
  if(n.type==='end') return `<div class="node end">● ${esc(n.title)}</div>`;
  const isPM = mode==='project', trig = n.type==='trigger';
  const st = isPM && !trig ? stepState(pid,n) : null;

  const cls = ['node', trig?'trigger':'', st?'s-'+st.status:'', st?'sch-'+st.sched:''].join(' ');
  const go = (trig || mode==='asis' || pid==='__draft') ? '' : `data-go="/process/${pid}/step/${n.id}"`;
  const showDiff = (mode==='diff'||isPM) && n.diff;
  const diff = showDiff ? `<span class="chip diff-${n.diff}">${n.diff==='new'?'NEW':'CHANGED'}</span>` : '';
  const was = mode==='diff' && n.diff==='changed' && n.from ? (()=>{ const a=PROCESSES[pid].asis.find(x=>x.id===n.from); return a && a.title!==n.title ? `<div class="was">was: ${esc(a.title)}</div>`:`<div class="was">same step, new method / data</div>`; })() : '';
  let body='';
  if(trig){ body = `<div class="stats">${(n.touches||[]).map(t=>`<span class="chip touch"># ${esc(t)}</span>`).join('')}</div>`; }
  else if(isPM){
    body = `<div class="meta">${stBadge(st)}</div>
      <div class="stats">${st.items.length?`<span>Work <b>${st.done}/${st.items.length}</b></span>`:''}<span>Data <b>${rd.live}/${rd.total}</b> live</span></div>

  } else {
    body = `<div class="stats"><span>Data <b>${rd.live}/${rd.total}</b> live</span>${rd.missing?`<span style="color:var(--late)">${LOCK} ${rd.missing} missing</span>`:''}<span>${(n.touches||[]).length} areas</span></div>${was}`;
  }
  return `<div class="${cls}" data-step="${n.id}" data-data="${(n.data||[]).join(',')}" ${go}>
    <div class="nh"><span class="ic">${trig?'⚡':idx}</span>
      <div style="min-width:0"><div class="ttl">${esc(n.title)}</div><div class="num">${trig?'Kickoff / trigger':esc(PEOPLE[n.owner]?.name||'')}</div></div>
      <div style="margin-left:auto;display:flex;gap:5px;align-items:center">${diff}${trig?'':av(n.owner)}</div></div>
    <div class="nb">${body}</div></div>`;
}
let showUnchanged = false;
function flowHTML(nodes,pid,mode,counter){
  counter = counter || {n:0};
  const parts=[]; let run=[];
  const flush=()=>{ if(!run.length) return; parts.push(`<button class="collapsed" data-expand="1">▸ ${run.length} unchanged step${run.length>1?'s':''}: ${run.map(r=>esc(r.title)).join(', ')} <span style="float:right">show</span></button>`); run=[]; };
  nodes.forEach(n=>{
    const collapsible = mode==='project' && !showUnchanged && n.type!=='trigger' && n.type!=='end' && n.type!=='decision' && stepWork(pid,n.id).length===0;
    if(collapsible){ counter.n++; run.push(n); return; }
    flush();
    if(n.type==='decision'){
      parts.push(`<div class="decision"><div class="diamond">◆ ${esc(n.title)}</div><div class="conn"></div>
        <div class="branches" style="--bl:${100/(n.branches.length*2)}%;--br:${100/(n.branches.length*2)}%">${n.branches.map(b=>`<div class="branch"><span class="blabel">${esc(b.label)}</span>
          ${b.nodes.length? `<div class="flow">${flowHTML(b.nodes,pid,mode,counter)}</div>` : `<div class="passthru">Continue → next step</div>`}</div>`).join('')}</div></div>`);
    } else {
      const idx = (n.type==='trigger'||n.type==='end')?'':(++counter.n);
      parts.push(nodeHTML(n,pid,idx,mode));
    }
  });
  flush();
  return parts.join(`<div class="conn add"><span class="plus" title="Insert step">+</span></div>`);
}
function removedHTML(pid){

  const dataRows = dl.sort((a,b)=>ord.indexOf(DATA[a].avail)-ord.indexOf(DATA[b].avail)).map(d=>{const x=DATA[d]; const used=steps.filter(s=>s.data.includes(d)).length;

      <div><div class="t">${esc(x.name)}</div><div class="s">${esc(x.source)} · ${esc(PEOPLE[x.owner].name)}</div></div>

  let canvas;

  else if(processMode==='asis') canvas = `<div class="flow">${flowHTML(p.asis,pid,'asis')}</div>`;
  else canvas = `<div class="flow">${flowHTML(p.nodes,pid,processMode)}${processMode==='diff'?removedHTML(pid):''}</div>`;
  const modeNote = {asis:'How the process runs today.',tobe:'The designed process. Tap a step to drill in.',diff:'To-be compared with as-is: what is new, what changed, and what was removed.',lanes:'The to-be process grouped by owner.'}[processMode];
  return headerHTML({crumbs:`<a href="${link('/')}" data-link>Workspace</a> › Process`,title:p.name,desc:p.desc,resources:p.resources,side})+
  `<div class="grid"><section class="canvas" id="canvas"><div class="hint" style="text-align:center;margin:-8px 0 14px">${modeNote}</div>${canvas}</section>

    <div class="card"><h3>${LOCK} Steps needing missing data <span class="n">${missingSteps.length}</span></h3>${missingSteps.length?missingSteps.map(s=>`<div class="row click" data-go="/process/${pid}/step/${s.id}"><div><div class="t">${esc(s.title)}</div><div class="s">Needs ${s.data.filter(d=>DATA[d].avail==='missing').map(d=>esc(DATA[d].name)).join(', ')}</div></div><div class="r">${av(s.owner)}</div></div>`).join(''):'<div class="s">All data has a source.</div>'}</div>

    <div class="card"><h3>Used in projects</h3>${linkedProjects.map(([id,j])=>`<div class="row click" data-go="/project/${id}"><div><div class="t">${esc(j.name)}</div><div class="s">Target ${fmt(j.target)}</div></div><div class="r" style="color:var(--accent)">Open ›</div></div>`).join('')||'<div class="s">Not linked to a project yet.</div>'}</div>
   </aside></div>`;

let projectMode = 'map';
function timelineHTML(j){
  const items=WORK.filter(w=>j.processes.includes(w.pid));
  const start=addDays(items.map(w=>w.start).sort()[0],-2), end=addDays(maxDate([...items.map(forecast),j.target]),4);
  const span=(D(end)-D(start))/86400000, pos=s=>((D(s)-D(start))/86400000/span*100);
  const ticks=[]; for(let d=start; d<=end; d=addDays(d,7)) ticks.push(d);
  let rows=`<tr class="thead"><td class="lab"></td><td class="lane">${ticks.map(t=>`<span class="tick" style="left:${pos(t)}%">${fmt(t)}</span>`).join('')}<span class="tday" style="left:${pos(iso(TODAY))}%"></span><span class="tgt" style="left:${pos(j.target)}%"></span></td></tr>`;
  j.processes.forEach(pid=>{
    rows+=`<tr class="grp"><td class="lab">${esc(PROCESSES[pid].name)}</td><td></td></tr>`;
    flatSteps(PROCESSES[pid].nodes).forEach(s=>stepWork(pid,s.id).forEach(w=>{
      const f=forecast(w), l=pos(w.start), wd=Math.max(1.5,pos(w.due)-l);
      rows+=`<tr class="click" data-go="/process/${pid}/step/${s.id}"><td class="lab"><div class="t">${esc(w.title)}</div><div class="s">${esc(s.title)} · ${esc(PEOPLE[w.owner].name)}${w.deps?' · after '+w.deps.join(', '):''}</div></td>
        <td class="lane"><span class="tday" style="left:${pos(iso(TODAY))}%"></span><span class="tgt" style="left:${pos(j.target)}%"></span>
        <span class="tbar ${w.status}" style="left:${l}%;width:${wd}%">${w.id}${w.resolves?' · unblocks '+esc(DATA[w.resolves].name):''}</span>
        ${f>w.due?`<span class="tslip" style="left:${pos(w.due)}%;width:${pos(f)-pos(w.due)}%" title="Forecast ${fmt(f)}"></span>`:''}</td></tr>`;
    }));
  });
  return `<div class="tl"><table>${rows}</table></div>
   <div class="legend" style="margin-top:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">
    <div><span class="sw" style="background:var(--done)"></span>Done</div><div><span class="sw" style="background:var(--prog)"></span>In progress</div><div><span class="sw" style="background:#94a3b8"></span>Not started</div>
    <div><span class="sw" style="background:repeating-linear-gradient(45deg,#fecaca,#fecaca 4px,#fee2e2 4px,#fee2e2 8px)"></span>Forecast slip</div><div><span class="sw" style="border:0;border-left:2px solid var(--accent);border-radius:0"></span>Today</div><div><span class="sw" style="border:0;border-left:2px dashed #16a34a;border-radius:0"></span>Target</div></div>`;
}
function pageProject(prj){
  const j = PROJECTS[prj]; if(!j) return notFound();
  const s = projStats(j);
  const open = s.items.filter(w=>w.status!=='done');
  /* Up next = open work ranked by how much downstream work it unblocks, then by due date */
  const ranked = open.map(w=>({w,n:dependents(w.id).length})).sort((a,b)=>b.n-a.n || a.w.due.localeCompare(b.w.due));
  const missing = Object.keys(DATA).filter(d=>!dataReady(d)).map(d=>{
    const held=allSteps().filter(x=>j.processes.includes(x.pid) && x.s.data.includes(d) && stepWork(x.pid,x.s.id).some(w=>w.status!=='done'));
    return {d,held,r:resolverOf(d)}; }).filter(x=>x.held.length).sort((a,b)=>b.held.length-a.held.length);
  const side = `<div class="seg" id="pmSeg">${[['map','Map'],['timeline','Timeline']].map(([k,l])=>`<button data-pm="${k}" class="${projectMode===k?'on':''}">${l}</button>`).join('')}</div>
    <div class="kpis"><div class="kpi"><b>${s.pct}%</b><span>${s.done}/${s.items.length} work done</span></div><div class="kpi"><b style="color:var(--late)">${s.late}</b><span>Late</span></div><div class="kpi"><b style="color:var(--late)">${s.slip}</b><span>Slipping</span></div><div class="kpi"><b style="color:${s.finish>j.target?'var(--late)':'inherit'}">${fmt(s.finish)}</b><span>Forecast (target ${fmt(j.target)})</span></div></div>`;
  const canvas = projectMode==='timeline' ? timelineHTML(j) :
    `${j.processes.map(pid=>`<div class="pgroup"><a class="pgroup-h" href="${link('/process/'+pid)}" data-link>▤ ${esc(PROCESSES[pid].name)} <span style="color:var(--accent);font-weight:500">open design ›</span></a><div class="flow">${flowHTML(PROCESSES[pid].nodes,pid,'project')}</div></div>`).join('')}
     <div style="text-align:center;margin-top:28px">${showUnchanged?'<button class="btn" data-expand="0">Hide unchanged steps</button> ':''}<button class="btn" onclick="alert('Concept: pick an existing process to link into this project.')">+ Link another process</button></div>`;
  return headerHTML({crumbs:`<a href="${link('/')}" data-link>Workspace</a> › Project`,title:j.name,desc:j.desc,resources:j.resources,side})+
  `<div class="grid"><section class="${projectMode==='map'?'canvas pm':''}" id="canvas">${canvas}</section>
   <aside class="side">
    <div class="card"><h3>Biggest blockers <span class="n">${missing.length}</span></h3>${missing.map(({d,held,r})=>`<div class="row click" data-go="/data/${d}"><span style="color:var(--late);margin-top:2px">${LOCK}</span><div><div class="t">${esc(DATA[d].name)}</div>
      <div class="s">${r?`Fix: ${esc(r.title)} · ${esc(PEOPLE[r.owner].name)} · ${wBadge(r)}`:'<span style="color:var(--late);font-weight:600">No resolution plan</span>'}</div></div><div class="r"><b style="color:var(--late)">${held.length}</b><div class="s">steps held</div></div></div>`).join('')||'<div class="s">No data blockers.</div>'}</div>
    <div class="card"><h3>Up next <span class="n">${open.length}</span></h3><div class="hint" style="margin:-4px 0 8px">Ranked by how much downstream work each one unblocks</div>${ranked.slice(0,5).map(({w,n})=>`<div class="row click" data-go="/process/${w.pid}/step/${w.step}">${av(w.owner)}<div><div class="t">${esc(w.title)}</div><div class="s">${n?`<b style="color:var(--ink)">Unblocks ${n}</b> · `:''}${esc(findStep(w.pid,w.step).title)}</div></div><div class="r">${wBadge(w)}</div></div>`).join('')}</div>
    <div class="card"><h3>Due dates</h3>${open.slice().sort((a,b)=>a.due.localeCompare(b.due)).map(w=>`<div class="row click" data-go="/process/${w.pid}/step/${w.step}"><div style="width:44px;text-align:center"><b>${fmt(w.due).split(' ')[1]}</b><div class="s">${fmt(w.due).split(' ')[0]}</div></div><div><div class="t">${esc(w.title)}</div><div class="s">${esc(PEOPLE[w.owner].name)}</div></div><div class="r">${wBadge(w)}</div></div>`).join('')}</div>
    <div class="card"><h3>How to read the map</h3><div class="legend">
      <div><span class="sw" style="background:var(--done-fill);border-color:#bbf7d0"></span>Done</div>
      <div><span class="sw" style="background:var(--prog-fill);border-left:4px solid var(--prog)"></span>In progress</div>
      <div><span class="sw" style="background:var(--idle-fill)"></span>Not started</div>
      <div><span class="sw" style="border:2px solid var(--soon)"></span>Due within 5 days</div>
      <div><span class="sw" style="border:2px solid var(--late)"></span>Late or slipping</div>
      <div><span class="chip block" style="padding:1px 6px">${LOCK}</span> Waiting on data</div>
      <div><span class="chip diff-new">NEW</span> Not in as-is</div>
      <div><span class="chip diff-changed">CHANGED</span> Differs from as-is</div></div>
      <div class="hint" style="margin-top:8px">A step's status comes from its work items. Steps with no work are collapsed. A late fix pushes back every item that depends on it.</div></div>
   </aside></div>`;
}

function pageStep(pid,sid){

  const steps = flatSteps(p.nodes); const i = steps.indexOf(s);
  const prev = steps[i-1], next = steps[i+1];
  const asis = s.from ? p.asis.find(a=>a.id===s.from) : null;
  return `<section class="hdr"><div><div class="crumbs"><a href="${link('/')}" data-link>Workspace</a> › <a href="${link('/process/'+pid)}" data-link>${esc(p.name)}</a> › Step ${i+1}</div>

    <div class="hdr-side"><div style="display:flex;gap:6px;flex-wrap:wrap">${prev?`<a class="btn" href="${link('/process/'+pid+'/step/'+prev.id)}" data-link>‹ ${esc(prev.title)}</a>`:''}${next?`<a class="btn" href="${link('/process/'+pid+'/step/'+next.id)}" data-link>${esc(next.title)} ›</a>`:''}</div></div></section>
  <div class="kgrid">
    <div class="kc"><span>Project status</span><b>${statusLbl[st.status]}</b><small>${st.items.length?st.done+'/'+st.items.length+' work items':'nothing to build'}</small></div>
    <div class="kc"><span>Forecast</span><b style="color:${st.sched==='late'||st.sched==='slip'?'var(--late)':st.sched==='soon'?'#b45309':'inherit'}">${st.fc?fmt(st.fc):'—'}</b><small>${st.due?(st.fc>st.due?'planned '+fmt(st.due):'on plan'):'no work'}</small></div>
    <div class="kc"><span>Data ready</span><b>${rd.live}/${rd.total}</b><small>live integrations</small></div>

  </div>
  <div class="two">
    <div class="card"><h3>How this step runs <span class="n">process</span></h3><div class="subs">${(s.subs||[]).map((x,k)=>{ const miss=x[1].filter(d=>DATA[d].avail==='missing'); return `<div class="sub ${miss.length?'blocked':''}"><span class="dotc">${miss.length?'!':k+1}</span><div><div class="t" style="font-weight:600">${esc(x[0])}</div><div class="s">${x[1].length?x[1].map(d=>`${dot(d)} ${esc(DATA[d].name)}`).join(' &nbsp; '):'No data needed'}</div></div></div>`}).join('')}</div></div>
    <div class="card"><h3>Work to deliver it <span class="n">project</span></h3>${st.items.length?st.items.map(w=>`<div class="wi">${av(w.owner)}<div style="flex:1"><div class="t" style="font-weight:600">${esc(w.title)}</div>
        <div class="dep">${w.resolves?`Makes <b>${esc(DATA[w.resolves].name)}</b> available · `:''}${w.deps?`After ${w.deps.map(d=>esc(W(d).title)+(W(d).status==='done'?' ✓':' (open)')).join(', ')}`:'No dependencies'}</div></div>
        <div style="text-align:right">${wBadge(w)}<div class="s" style="font-size:11px;margin-top:3px">${fmt(w.start)} → ${fmt(w.due)}</div></div></div>`).join(''):'<div class="s">This step is unchanged, so the project has no work for it.</div>'}</div>

    <div class="card"><h3>Also touched by this change</h3>${shared.length?shared.map(x=>`<div class="row click" data-go="/process/${x.pid}/step/${x.s.id}"><div><div class="t">${esc(x.s.title)}</div><div class="s">${esc(x.p.name)} · shares ${x.s.data.filter(d=>s.data.includes(d)).map(d=>esc(DATA[d].name)).join(', ')}</div></div><div class="r">${av(x.s.owner)}</div></div>`).join(''):'<div class="s">No other steps share this data.</div>'}</div>
  </div>`;
}

/* ---------- create new workflow (in-memory only; nothing is saved) ---------- */
const draft = {name:'Untitled workflow',desc:'',resources:['mc'],nodes:[{id:'k',type:'trigger',title:'Kickoff: what starts this process?',owner:'mc',touches:[],data:[]}],adding:false};

      <label>Data it needs (tap to tag)</label><div class="chips" id="fData">${Object.entries(DATA).map(([k,d])=>`<span class="chip data" data-pick="${k}"><span class="dot" style="background:${AVAIL[d.avail].color}"></span>${esc(d.name)}</span>`).join('')}</div>

    : `<button class="btn primary" id="addStep">+ Add step</button>`);
  const miss = steps.filter(s=>s.data.some(d=>DATA[d].avail==='missing'));
  return `<section class="hdr"><div><div class="crumbs"><a href="${link('/')}" data-link>Workspace</a> › New workflow</div>
      <input class="title" id="wfName" value="${esc(draft.name)}" />
      <textarea id="wfDesc" rows="2" placeholder="Description: what this process does and where it ends">${esc(draft.desc)}</textarea>
      <div class="res"><span class="lbl">Resources</span>${draft.resources.map(person).join('')}
        <select id="addRes" class="btn" style="padding:4px 8px"><option value="">+ Assign</option>${Object.entries(PEOPLE).filter(([k])=>!draft.resources.includes(k)).map(([k,p])=>`<option value="${k}">${esc(p.name)}</option>`).join('')}</select></div></div>
    <div class="hdr-side"><div class="kpis"><div class="kpi"><b>${steps.length}</b><span>Steps</span></div><div class="kpi"><b>${dl.length}</b><span>Data tagged</span></div></div><span class="hint">Concept only: nothing is saved</span></div></section>
  <div class="grid"><section class="canvas"><div class="flow">${flow}<div class="conn"></div><div class="node end">● End</div></div></section>
  <aside class="side"><div class="card"><h3>Data requirements <span class="n">${dl.length}</span></h3>${dl.length?dl.map(d=>`<div class="row"><span style="margin-top:3px">${dot(d)}</span><div><div class="t">${esc(DATA[d].name)}</div><div class="s">${AVAIL[DATA[d].avail].label} · ${esc(PEOPLE[DATA[d].owner].name)}</div></div></div>`).join(''):'<div class="s">Tag data on each step and this list builds itself.</div>'}</div>
  <div class="card"><h3>${LOCK} Steps needing missing data</h3>${miss.map(s=>`<div class="row"><div><div class="t">${esc(s.title)}</div><div class="s" style="color:var(--late)">Needs ${s.data.filter(d=>DATA[d].avail==='missing').map(d=>esc(DATA[d].name)).join(', ')}</div></div></div>`).join('')||'<div class="s">None yet.</div>'}</div></aside></div>`;
}
function bindNew(){
  $('#wfName').oninput=e=>draft.name=e.target.value;
  $('#wfDesc').oninput=e=>draft.desc=e.target.value;
  $('#addRes').onchange=e=>{ if(e.target.value){ draft.resources.push(e.target.value); render(); } };
  const add=$('#addStep'); if(add) add.onclick=()=>{draft.adding=true; render(); $('#fTitle').focus();};
  const form=$('#addForm'); if(!form) return;
  const picked=new Set();
  form.querySelectorAll('[data-pick]').forEach(c=>c.onclick=()=>{ const k=c.dataset.pick; picked.has(k)?picked.delete(k):picked.add(k); c.style.borderColor=picked.has(k)?'var(--accent)':''; c.style.background=picked.has(k)?'var(--accent-soft)':''; });
  $('#fCancel').onclick=()=>{draft.adding=false; render();};
  $('#fSave').onclick=()=>{ const t=$('#fTitle').value.trim()||'Untitled step';
    draft.nodes.push({id:'n'+draft.nodes.length,title:t,owner:$('#fOwner').value,data:[...picked],touches:$('#fTouch').value.split(',').map(x=>x.trim()).filter(Boolean),subs:[]});
    draft.adding=false; render(); };
}

function notFound(){ return `<div class="card"><h3>Not found</h3><a href="${link('/')}" data-link style="color:var(--accent)">Back to workspace</a></div>`; }

/* ---------- router ---------- */
function route(){
  const path = location.pathname.slice(BASE.length).replace(/\/+$/,'') || '/';
  const m = s => path.match(s);
  let r;
  if(path==='/') r={nav:'home',html:pageHome()};
  else if(r=m(/^\/process\/([\w-]+)\/step\/([\w-]+)$/)) r={nav:'process',html:pageStep(r[1],r[2])};
  else if(r=m(/^\/process\/([\w-]+)$/)) r={nav:'process',html:pageProcess(r[1])};
  else if(r=m(/^\/project\/([\w-]+)$/)) r={nav:'project',html:pageProject(r[1])};
  else if(r=m(/^\/data\/(\w+)$/)) r={nav:'data',html:pageData(r[1])};
  else if(path==='/new') r={nav:'new',html:pageNew(),after:bindNew};
  else r={nav:'',html:notFound()};
  return r;
}
function render(){
  const r = route();
  $('#nav').innerHTML = [['home','/','Workspace'],['process','/process/vendor-onboarding','Process view'],['project','/project/vendor-modernization','Project view'],['new','/new','+ New workflow']]
    .map(([k,p,l])=>`<a href="${link(p)}" data-link class="${r.nav===k?'on':''}">${l}</a>`).join('');
  $('#brand').setAttribute('href', link('/'));
  $('#app').innerHTML = r.html;
  if(r.after) r.after();
}
function go(p){ history.pushState({},'',link(p)); render(); window.scrollTo(0,0); }
document.addEventListener('click',e=>{
  const seg = e.target.closest('#modeSeg button'); if(seg){ processMode=seg.dataset.mode; render(); return; }
  const pm = e.target.closest('#pmSeg button'); if(pm){ projectMode=pm.dataset.pm; render(); return; }
  const ex = e.target.closest('[data-expand]'); if(ex){ showUnchanged = ex.dataset.expand==='1'; render(); return; }
  const hl = e.target.closest('[data-hl]');
  if(hl && !e.target.closest('a')){            // highlight every step using this data element
    const d = hl.dataset.hl, nodes=document.querySelectorAll('.node[data-step]');
    const already = hl.classList.contains('hl-on');
    document.querySelectorAll('.hl-on').forEach(x=>x.classList.remove('hl-on'));
    nodes.forEach(n=>{ n.classList.remove('dim','hl'); if(!already){ const has=(n.dataset.data||'').split(',').includes(d); n.classList.add(has?'hl':'dim'); }});
    if(!already){ hl.classList.add('hl-on'); const first=document.querySelector('.node.hl'); if(first && window.innerWidth<1060) first.scrollIntoView({behavior:'smooth',block:'center'}); }
    return;
  }
  const a = e.target.closest('a[data-link]');
  if(a){ e.preventDefault(); history.pushState({},'',a.getAttribute('href')); render(); window.scrollTo(0,0); return; }
  const g = e.target.closest('[data-go]');
  if(g){ go(g.dataset.go); }
});
window.addEventListener('popstate',render);
render();
</script>
</body>
</html>
